<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 272 64" role="img" aria-label="TR Patron Palet">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E9CE7F"/>
      <stop offset=".5" stop-color="#D4AF37"/>
      <stop offset="1" stop-color="#B8860B"/>
    </linearGradient>
  </defs>

  <!-- Rozet -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#0D1117"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="url(#gold)" stroke-width="1.6"/>
  <rect x="7.5" y="7.5" width="49" height="49" rx="10.5" fill="none" stroke="url(#gold)" stroke-opacity=".35"/>

  <!-- Palet sembolü: tabliye tahtaları, takozlar, alt tahta -->
  <rect x="19" y="15" width="26" height="4.4" rx="2.2" fill="url(#gold)"/>
  <rect x="19" y="22.9" width="26" height="4.4" rx="2.2" fill="url(#gold)" opacity=".8"/>
  <rect x="19" y="30.8" width="26" height="4.4" rx="2.2" fill="url(#gold)"/>
  <rect x="21" y="36.7" width="6" height="6.2" fill="url(#gold)" opacity=".8"/>
  <rect x="29" y="36.7" width="6" height="6.2" fill="url(#gold)" opacity=".8"/>
  <rect x="37" y="36.7" width="6" height="6.2" fill="url(#gold)" opacity=".8"/>
  <rect x="19" y="44.8" width="26" height="4.4" rx="2.2" fill="url(#gold)"/>

  <!-- Yazı bloğu -->
  <text x="76" y="31" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="20" font-weight="700" letter-spacing="2.2" fill="#F4F4F4">TR PATRON</text>
  <rect x="76.5" y="39.5" width="104" height="1.3" fill="url(#gold)" opacity=".75"/>
  <text x="76" y="55" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="13" font-weight="600" letter-spacing="8.2" fill="url(#gold)">PALET</text>
</svg>
